<!DOCTYPE html>
<html lang="en">

<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/37d1147389.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Chalo Chale Travel App</title>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12 p-0 m-0">
                <nav class="navbar navbar-expand-lg bg-dark navbar-dark">
                    <div class="container">
                        <a href="#" class="navbar-brand fw-bold">
                            <i class="fa-solid fa-plane-departure"></i> ChaloChale
                        </a>

                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navmenu">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse" id="menu">
                            <ul class="navbar-nav ms-auto">
                                <li class="nav-item"><a href="index.html" class="nav-link fw-bold">Home</a></li>
                                <li class="nav-item"><a href="destinations.html" class="nav-link fw-bold">Destinations</a></li>
                                <li class="nav-item"><a href="booking.html" class="nav-link fw-bold active">Booking</a></li>
                                <li class="nav-item"><a href="packages.html" class="nav-link fw-bold">Packages</a></li>
                                <li class="nav-item"><a href="about.html" class="nav-link fw-bold">About</a></li>
                                <li class="nav-item"><a href="contact.html" class="nav-link fw-bold">Contact</a></li>
                            </ul>
                            <a href="signup.html" class="btn btn-warning ms-lg-3">Sign Up</a>
                            <a href="login.html" class="btn btn-warning ms-lg-3">Login</a>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>

    <section class="py-5 bg-light text-center">
        <div class="container">
            <h1 class="fw-bold">Travel Booking Form</h1>
            <p class="lead">Fill the form and submit your travel request</p>
        </div>
    </section>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-12 col-md-10 col-lg-8">
                    <div class="card shadow-lg p-4 rounded-4">

                        <h3 class="fw-bold mb-4 text-center">Book Your Trip</h3>

                        <form>

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" class="form-control" placeholder="Enter your name">
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Enter your email">
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Select Destination</label>

                                    <select class="form-select">
                                        <option>Goa</option>
                                        <option>Manali</option>
                                        <option>Kerala</option>
                                        <option>Jaipur</option>
                                        <option>Agra</option>
                                    </select>
                                </div>

                                <div class="col-12 col-md-6 mb-3">
                                    <label class="form-label">Travel Date</label>
                                    <input type="date" class="form-control">
                                </div>

                            </div>

                            <div class="mb-3">
                                <label class="form-label">Number of People</label>
                                <input type="number" class="form-control" placeholder="Enter number of people">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Message / Requirements</label>
                                <textarea class="form-control" rows="4"
                                    placeholder="Enter any travel requirements"></textarea>
                            </div>

                            <button type="submit" class="btn btn-success w-100">
                                Submit Booking Request
                            </button>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer Section Start -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <div class="mb-3">
                <a href="#" class="text-white me-3 fs-4"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="text-white me-3 fs-4"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="text-white me-3 fs-4"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" class="text-white me-3 fs-4"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#" class="text-white fs-4"><i class="fa-brands fa-youtube"></i></a>
            </div>
            <p class="mb-0">&copy; 2026 Chale Chalo Travel App | Designed with Bootstrap</p>
        </div>
    </footer>


    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
